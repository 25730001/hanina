<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>운동 가이드 와이어프레임</title>
<link rel="stylesheet" href="./css/style.css">
<script src="./js/app.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="jump" id="screen-jump"></div>
  <div class="path" id="route-path"></div>
  <div class="phone">
    <header>
      <button class="logo" data-go="home">LOGO</button>
      <input data-s placeholder="운동 검색" aria-label="운동 검색">
      <button data-menu aria-label="메뉴">☰</button>
    </header>
    <div class="menu" id="menu-list">
      <button data-go="home">홈</button>
      <button data-go="explore">운동 탐색</button>
      <button data-go="my">내 운동</button>
    </div>
    <main id="screen-view"></main>
    <nav id="bottom-nav">
      <button data-go="home">홈</button>
      <button data-go="explore">운동 탐색</button>
      <button data-go="my">내 운동</button>
    </nav>
  </div>
</div>
</body>
</html>
