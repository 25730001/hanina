<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>코어시크 coreseek</title>
<link rel="stylesheet" href="./css/style.css">
<script src="./js/app.js" defer></script>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="logo" data-go="home">코어시크</button>
    <input id="search-input" data-s placeholder="🔍 운동명·기구명 검색" aria-label="운동 검색">
    <button class="menu-btn" data-menu aria-label="메뉴">☰</button>
  </header>
  <div class="drawer" id="menu-list">
    <div class="scrim" data-menu></div>
    <aside class="panel">
      <div class="phead"><b>전체 메뉴</b><button class="x" data-menu aria-label="닫기">✕</button></div>
      <h4>메뉴</h4>
      <button class="mi" data-go="home">홈<i>›</i></button>
      <button class="mi" data-go="explore">운동 탐색<i>›</i></button>
      <h4>부위별</h4>
      <div class="row"><button class="chip" data-part="가슴">가슴</button><button class="chip" data-part="등">등</button><button class="chip" data-part="하체">하체</button><button class="chip" data-part="어깨">어깨</button></div>
      <h4>난이도별</h4>
      <div class="row"><button class="chip" data-level="초급">초급</button><button class="chip" data-level="중급">중급</button></div>
      <h4>기구별</h4>
      <div class="row"><button class="chip" data-equip="맨몸">맨몸</button><button class="chip" data-equip="머신">머신</button><button class="chip" data-equip="덤벨">덤벨</button><button class="chip" data-equip="바벨">바벨</button></div>
      <h4>내 운동</h4>
      <button class="mi" data-mytab="favs">관심 운동<i>›</i></button>
      <button class="mi" data-mytab="recent">최근 본 운동<i>›</i></button>
    </aside>
  </div>
  <main id="screen-view"></main>
  <nav id="bottom-nav">
    <button data-go="home"><span>🏠</span>홈</button>
    <button data-go="explore"><span>🔎</span>탐색</button>
    <button data-go="my"><span>⭐</span>보관함</button>
  </nav>
</div>
</body>
</html>
