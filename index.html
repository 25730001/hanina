<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta http-equiv="Cache-Control" content="no-cache">
<title>코어시크 coreseek</title>
<link rel="stylesheet" href="./css/style.css?v=20261123g">
<script src="./js/app.js?v=20261123g" defer></script>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="logo" data-go="home">코어시크</button>
    <button class="auth-btn" data-authbtn aria-label="로그인 또는 회원가입"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button>
  </header>
  <div class="drawer" id="menu-list">
    <div class="scrim" data-menu></div>
    <aside class="panel">
      <div class="phead"><b id="panel-title">로그인</b><button class="x" data-menu aria-label="닫기">✕</button></div>
      <div id="menu-body"></div>
    </aside>
  </div>
  <main id="screen-view"></main>
  <nav id="bottom-nav">
    <button data-go="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>홈</button>
    <button data-go="explore"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path class="ln" d="m16 16 4.5 4.5"/></svg>탐색</button>
    <button data-go="my"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4.5-6.5 4.5v-16a1 1 0 0 1 1-1z"/></svg>보관함</button>
  </nav>
</div>
